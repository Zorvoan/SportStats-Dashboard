<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrace - SportPulse</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.2.0/dist/fonts/geist-sans.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .register-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .register-container {
            width: 100%;
            max-width: 420px;
        }
    </style>
</head>
<body>
    <div class="register-page">
        <div class="register-container">
            <a href="index.html" class="login-back">
                <i class="fas fa-arrow-left"></i>
                Zpět na přihlášení
            </a>

            <div class="login-card">
                <h2 class="login-title">Vytvořit účet</h2>
                <form id="registerForm">
                    <div class="input-group">
                        <label for="regUsername">Uživatelské jméno</label>
                        <input type="text" id="regUsername" class="input" placeholder="Zadejte uživatelské jméno" required>
                    </div>
                    <div class="input-group">
                        <label for="regEmail">Email</label>
                        <input type="email" id="regEmail" class="input" placeholder="vas@email.cz" required>
                    </div>
                    <div class="input-group">
                        <label for="regPassword">Heslo</label>
                        <input type="password" id="regPassword" class="input" placeholder="Minimálně 6 znaků" required>
                    </div>
                    <div class="input-group">
                        <label for="regConfirmPassword">Potvrdit heslo</label>
                        <input type="password" id="regConfirmPassword" class="input" placeholder="Zopakujte heslo" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">
                        <i class="fas fa-user-plus"></i>
                        Zaregistrovat se
                    </button>
                </form>
                <div id="registerError" class="error-message"></div>

                <div class="login-footer">
                    Již máte účet? <a href="index.html">Přihlaste se</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Kontrola, zda je uživatel již přihlášen
        if (getCurrentUser()) {
            window.location.href = 'dashboard.html';
        }

        // Inicializace registračního formuláře
        initRegisterForm();
    </script>
</body>
</html>
